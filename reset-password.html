<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buat Password Baru - UPA Bahasa POLNES</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0E7A3F] font-['Plus_Jakarta_Sans'] min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-7 sm:p-9 shadow-2xl space-y-5">
    <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
      <img src="./img/polnes.png" alt="Logo POLNES" class="w-10 h-10 object-contain" />
      <div>
        <p class="text-[10px] font-extrabold uppercase text-[#169C53]">Keamanan Akun Staf</p>
        <h1 class="text-lg font-extrabold text-slate-900">Buat Password Baru</h1>
      </div>
    </div>

    <form onsubmit="simpanPasswordBaru(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Password Baru (Min. 8 Karakter)</label>
        <input type="password" id="newPassInput" required minlength="8" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-[#169C53] outline-none" />
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Konfirmasi Password Baru</label>
        <input type="password" id="confirmNewPassInput" required minlength="8" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-[#169C53] outline-none" />
      </div>
      <button type="submit" id="btnSimpanPassBaru" class="w-full py-3 rounded-xl bg-[#169C53] hover:bg-[#0E7A3F] text-white font-extrabold text-sm transition-all">
        Simpan Password Baru
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script>
    const SALT_KEAMANAN_UPA = "UPA-BAHASA-POLNES-2026-SECURE-AUTH";
    async function hashPasswordSha256(plainText) {
      const data = new TextEncoder().encode(`${SALT_KEAMANAN_UPA}::${String(plainText)}`);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return "sha256$" + Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function simpanPasswordBaru(e) {
      e.preventDefault();
      const p1 = document.getElementById("newPassInput").value;
      const p2 = document.getElementById("confirmNewPassInput").value;
      if (p1 !== p2) return alert("Konfirmasi password tidak cocok!");

      const btn = document.getElementById("btnSimpanPassBaru");
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      try {
        const { data: sessionData } = await window.supabaseClient.auth.getSession();
        const emailUser = sessionData?.session?.user?.email;
        if (!emailUser) throw new Error("Sesi reset password tidak valid atau sudah kedaluwarsa.");

        await window.supabaseClient.auth.updateUser({ password: p1 });

        const hashed = await hashPasswordSha256(p1);
        await window.supabaseClient
          .from("user_app")
          .update({ password: hashed })
          .ilike("email", emailUser);

        alert("Password berhasil diperbarui! Silakan login dengan password baru Anda.");
        window.location.href = "login.html";
      } catch (err) {
        alert("Gagal memperbarui password: " + err.message);
        btn.disabled = false;
        btn.textContent = "Simpan Password Baru";
      }
    }
  </script>
</body>
</html>
